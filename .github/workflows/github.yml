name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 1 * * *'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - uat
          - staging
          - prod
      testSuite:
        description: 'Select Test Suite'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - sanity
          - api    
          
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        ENV: ${{ inputs.environment || 'qa' }}
        BASE_URL: ${{ secrets.BASE_URL }}
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        echo "=================================="
        echo "GitHub Event : ${{ github.event_name }}"
        echo "Environment  : $ENV"
        echo "Test Suite   : ${{ inputs.testSuite }}"
        echo "Runner       : $RUNNER_OS"
        echo "=================================="

        if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "Running Smoke Tests..."
          npx playwright test --grep "@smoke"

        elif [ "${{ github.event_name }}" = "schedule" ]; then
          echo "Running Nightly Regression on QA..."
          npx playwright test --grep "@regression"

        elif [ "${{ inputs.testSuite }}" = "all" ]; then
          echo "Running Complete Test Suite..."
          npx playwright test

        else
          echo "Running ${{ inputs.testSuite }} Tests..."
          npx playwright test --grep "@${{ inputs.testSuite }}"
        fi
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30